name: CI - Proyecto Nginx Portainer

on:
  push:
    branches:
      - main
      - feature/vulnerabilidades
  pull_request:
    branches:
      - main

jobs:

  pytest:
    name: Pytest - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ejecutar pruebas
        run: pytest


  bandit:
    name: Bandit - SAST
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Bandit
        run: pip install bandit

      - name: Analizar código con Bandit
        run: bandit -r . -ll


  build:
    name: Build - Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t proyecto-nginx-portainer:latest .

      - name: Verificar imagen
        run: docker images proyecto-nginx-portainer


  trivy:
    name: Trivy - Image Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t proyecto-nginx-portainer:scan .

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: proyecto-nginx-portainer:scan
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: 'HIGH,CRITICAL'


  docker:
    name: Docker - Build and Push
    runs-on: ubuntu-latest
    needs:
      - pytest
      - bandit
      - trivy

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/proyecto-nginx-portainer:latest .

      - name: Subir imagen a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/proyecto-nginx-portainer:latest
