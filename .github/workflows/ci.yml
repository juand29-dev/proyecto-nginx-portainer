name: CI - Proyecto Nginx Portainer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  build:
    name: Build - Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen Docker
        run: docker build -t proyecto-nginx-portainer:latest .

      - name: Verificar imagen
        run: docker images proyecto-nginx-portainer


  trivy:
    name: Trivy - Image Scan
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen vulnerable
        run: docker build -t proyecto-nginx-portainer:vulnerable .

      - name: Analizar imagen con Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: proyecto-nginx-portainer:vulnerable
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: 'HIGH,CRITICAL'


  docker:
    name: Docker - Build and Push
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/proyecto-nginx-portainer:latest .

      - name: Subir imagen a Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/proyecto-nginx-portainer:latest
